<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Intake Assistant</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 600;
      }
      p {
        margin: 0.75rem 0 0;
        color: #475569;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      button {
        margin-top: 1.5rem;
        border: none;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.625rem 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Oh no, you&rsquo;re offline</h1>
      <p>
        We couldn&rsquo;t load the app. Check your internet connection, then try
        again.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
